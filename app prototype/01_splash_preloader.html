<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 – Splash & Preloader</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700;0,9..144,900&family=DM+Sans:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--teal:#00C1B2;--teal-dark:#004943;--orange:#FF6B35;--amber:#FFB347;--ink:#1A1C1C;--cream:#F9F9F9}
body{background:#0d0d0d;display:flex;gap:40px;padding:40px;justify-content:center;flex-wrap:wrap;font-family:'DM Sans',sans-serif}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.lbl{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.phone{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;flex-shrink:0;border:1.5px solid rgba(255,255,255,.08);box-shadow:0 40px 100px rgba(0,0,0,.7)}

/* STATUS BAR */
.sb{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;z-index:20}
.sb-time{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700}
.sb-icons{display:flex;gap:4px;align-items:center;font-size:11px}

/* ──────────── DARK ──────────── */
.dark{width:100%;height:100%;background:radial-gradient(ellipse at 30% 15%,#0d2f2a 0%,#080f0e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dark .sb{color:rgba(255,255,255,.85)}
.dark::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(0,193,178,.025) 0,rgba(0,193,178,.025) 1px,transparent 0,transparent 50%),repeating-linear-gradient(-45deg,rgba(0,193,178,.025) 0,rgba(0,193,178,.025) 1px,transparent 0,transparent 50%);background-size:26px 26px;pointer-events:none}

/* blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.b1{width:280px;height:280px;background:radial-gradient(circle,rgba(0,193,178,.18) 0%,transparent 70%);top:-70px;left:-70px;animation:bp 7s ease-in-out infinite alternate}
.b2{width:200px;height:200px;background:radial-gradient(circle,rgba(255,107,53,.12) 0%,transparent 70%);bottom:100px;right:-50px;animation:bp 9s ease-in-out infinite alternate-reverse}
.b3{width:140px;height:140px;background:radial-gradient(circle,rgba(255,179,71,.08) 0%,transparent 70%);top:45%;left:45%;animation:bp 11s ease-in-out infinite}
@keyframes bp{0%{transform:scale(1)}100%{transform:scale(1.3) translate(12px,-12px)}}

/* floating adinkra text symbols */
.sym{position:absolute;font-size:28px;pointer-events:none;animation:fsym 8s ease-in-out infinite}
@keyframes fsym{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(6deg)}}

/* orb */
.orb-wrap{position:relative;width:154px;height:154px;margin-bottom:28px;z-index:2}
.orb-svg{width:100%;height:100%;transform:rotate(-90deg)}
.orb-bg{fill:none;stroke:rgba(0,193,178,.1);stroke-width:3}
.orb-prog{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-dasharray:301;animation:ospin 2.4s ease-in-out infinite}
@keyframes ospin{0%{stroke-dashoffset:280}50%{stroke-dashoffset:55}100%{stroke-dashoffset:280}}
.orb-inner{position:absolute;inset:14px;border-radius:50%;background:rgba(0,193,178,.07);border:1px solid rgba(0,193,178,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.orb-roo{width:86px;height:86px;object-fit:cover;object-position:top;border-radius:50%;animation:rfloat 3s ease-in-out infinite}
@keyframes rfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.orb-glow{position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,rgba(0,193,178,.13) 0%,transparent 70%);animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.18);opacity:1}}

/* logo + badge */
.splash-logo{z-index:2;margin-bottom:10px}
.splash-logo img{height:28px;filter:brightness(0) invert(1)}
.wa-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,193,178,.1);border:1px solid rgba(0,193,178,.25);border-radius:20px;padding:5px 14px;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--teal);text-transform:uppercase;z-index:2;margin-bottom:36px}
.wa-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:wad 1.5s ease-in-out infinite}
@keyframes wad{0%,100%{opacity:1}50%{opacity:.25}}

/* loading */
.splash-load{z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.splash-txt{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.3px}
.dots{display:flex;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:db 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* kente strip */
.kente{position:absolute;bottom:0;left:0;right:0;height:20px;display:flex}
.kb{flex:1;height:100%}

/* ──────────── LIGHT ──────────── */
.light{width:100%;height:100%;background:radial-gradient(ellipse at 70% 10%,rgba(0,193,178,.13) 0%,#f9f9f9 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.light .sb{color:rgba(26,28,28,.75)}
.light::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(0,73,67,.035) 0,rgba(0,73,67,.035) 1px,transparent 0,transparent 50%),repeating-linear-gradient(-45deg,rgba(0,73,67,.035) 0,rgba(0,73,67,.035) 1px,transparent 0,transparent 50%);background-size:26px 26px;pointer-events:none}
.light .orb-bg{stroke:rgba(0,73,67,.1)}
.light .orb-prog{stroke:#004943;filter:drop-shadow(0 0 6px rgba(0,73,67,.45))}
.light .orb-inner{background:rgba(0,193,178,.07);border-color:rgba(0,73,67,.15)}
.light .orb-glow{background:radial-gradient(circle,rgba(0,73,67,.1) 0%,transparent 70%)}
.light .splash-logo img{filter:none}
.light .wa-badge{background:rgba(0,73,67,.06);border-color:rgba(0,73,67,.18);color:#004943}
.light .wa-dot{background:#004943}
.light .dot{background:#004943}
.light .splash-txt{color:rgba(26,28,28,.45)}
</style>

<style id="mode-style">
    body.app-mode { 
        padding: 0 !important; 
        gap: 0 !important; 
        justify-content: flex-start !important; 
        overflow: hidden !important;
        background: #000 !important;
    }
    body.app-mode .col { display: none !important; width: 390px; height: 844px; }
    body.app-mode.nigeria .col:nth-of-type(1) { display: flex !important; }
    body.app-mode.ghana .col:nth-of-type(2) { display: flex !important; }
    body.app-mode .phone { 
        width: 390px !important; 
        height: 844px !important; 
        border-radius: 0 !important; 
        border: none !important; 
        box-shadow: none !important;
    }
    body.app-mode .lbl { display: none !important; }
</style>
<script>
    window.addEventListener('message', (e) => {
        if (e.data.type === 'setMode') {
            document.body.classList.add('app-mode');
            document.body.classList.remove('nigeria', 'ghana');
            document.body.classList.add(e.data.mode);
        }
    });
    // Default to app mode if inside iframe
    if (window.self !== window.top) {
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('app-mode');
            let country = localStorage.getItem('deliveroo_country') || 'nigeria';
            document.body.classList.remove('nigeria', 'ghana');
            document.body.classList.add(country);
        });
    }
</script>


<style id="nav-fix-style">
    /* Force the navigation to stay at the bottom of the device frame */
    body.app-mode .bottom-nav-wrap {
        position: fixed !important;
        bottom: 25px !important;
        left: 0 !important;
        right: 0 !important;
        z-index: 10000 !important;
        width: 390px !important;
        margin: 0 auto !important;
        padding: 0 !important;
        display: flex !important;
        justify-content: center !important;
        pointer-events: none !important;
    }
    body.app-mode .bottom-nav {
        pointer-events: auto !important;
        transform: scale(0.95); /* Slight scale down to ensure fit */
    }
    /* Ensure the screen content doesn't get hidden behind the nav */
    body.app-mode .screen {
        padding-bottom: 100px !important;
        height: 844px !important;
        width: 390px !important;
    }
</style>

</head>
<body>

<!-- DARK -->
<div class="col">
  <div class="lbl">Splash — Dark Mode</div>
  <div class="phone">
    <div class="dark">
      <div class="sb"><span class="sb-time">9:41</span><div class="sb-icons">▲▲▲ WiFi 🔋</div></div>
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <!-- Adinkra floating symbols (cultural West Africa) -->
      <div class="sym" style="top:88px;left:22px;color:#00C1B2;opacity:.07;animation-delay:0s">⊕</div>
      <div class="sym" style="top:170px;right:18px;color:#FFB347;opacity:.07;animation-delay:1.5s">❖</div>
      <div class="sym" style="bottom:220px;left:34px;color:#FF6B35;opacity:.06;animation-delay:3s">◈</div>
      <div class="sym" style="bottom:180px;right:28px;color:#00C1B2;opacity:.07;animation-delay:4.5s">⊗</div>
      <!-- ₦ ₵ currency hints -->
      <div class="sym" style="top:350px;left:12px;font-size:20px;font-family:'Space Grotesk',sans-serif;color:#FCD116;opacity:.09;animation-delay:2s">₦</div>
      <div class="sym" style="top:390px;right:16px;font-size:20px;font-family:'Space Grotesk',sans-serif;color:#FCD116;opacity:.09;animation-delay:3.5s">₵</div>

      <div class="splash-logo"><img src="../assets/logo-teal.svg" alt="Deliveroo"></div>
      <div class="wa-badge"><div class="wa-dot"></div>Lagos &amp; Accra</div>

      <div class="orb-wrap">
        <div class="orb-glow"></div>
        <svg class="orb-svg" viewBox="0 0 100 100">
          <circle class="orb-bg" cx="50" cy="50" r="48"/>
          <circle class="orb-prog" cx="50" cy="50" r="48"/>
        </svg>
        <div class="orb-inner"><img class="orb-roo" src="../assets/roo-wears/Agbada.png" alt="Roo"></div>
      </div>

      <div class="splash-load">
        <span class="splash-txt">Preparing your experience...</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>

      <!-- Kente colour strip (🇳🇬 green + 🇬🇭 gold + red) -->
      <div class="kente">
        <div class="kb" style="background:#006B3F;opacity:.65"></div>
        <div class="kb" style="background:#FCD116;opacity:.55"></div>
        <div class="kb" style="background:#CE1126;opacity:.5"></div>
        <div class="kb" style="background:#00C1B2;opacity:.5"></div>
        <div class="kb" style="background:#080f0e;opacity:.8"></div>
        <div class="kb" style="background:#FF6B35;opacity:.45"></div>
        <div class="kb" style="background:#006B3F;opacity:.65"></div>
        <div class="kb" style="background:#FCD116;opacity:.55"></div>
        <div class="kb" style="background:#00C1B2;opacity:.5"></div>
        <div class="kb" style="background:#CE1126;opacity:.5"></div>
      </div>
    </div>
  </div>
</div>

<!-- LIGHT -->
<div class="col">
  <div class="lbl">Splash — Light Mode</div>
  <div class="phone">
    <div class="light">
      <div class="sb"><span class="sb-time">9:41</span><div class="sb-icons">▲▲▲ WiFi 🔋</div></div>
      <div class="blob b1" style="background:radial-gradient(circle,rgba(0,193,178,.18) 0%,transparent 70%)"></div>
      <div class="blob b2" style="background:radial-gradient(circle,rgba(255,107,53,.1) 0%,transparent 70%)"></div>
      <div class="sym" style="top:88px;left:22px;color:#006A62;opacity:.08;animation-delay:0s">⊕</div>
      <div class="sym" style="top:170px;right:18px;color:#FFB347;opacity:.1;animation-delay:1.5s">❖</div>
      <div class="sym" style="bottom:220px;left:34px;color:#FF6B35;opacity:.08;animation-delay:3s">◈</div>
      <div class="sym" style="bottom:180px;right:28px;color:#006A62;opacity:.08;animation-delay:4.5s">⊗</div>
      <div class="sym" style="top:350px;left:12px;font-size:20px;font-family:'Space Grotesk',sans-serif;color:#006A62;opacity:.12;animation-delay:2s">₦</div>
      <div class="sym" style="top:390px;right:16px;font-size:20px;font-family:'Space Grotesk',sans-serif;color:#006A62;opacity:.12;animation-delay:3.5s">₵</div>

      <div class="splash-logo"><img src="../assets/logo-teal.svg" alt="Deliveroo"></div>
      <div class="wa-badge"><div class="wa-dot"></div>Lagos &amp; Accra</div>

      <div class="orb-wrap">
        <div class="orb-glow"></div>
        <svg class="orb-svg" viewBox="0 0 100 100">
          <circle class="orb-bg" cx="50" cy="50" r="48"/>
          <circle class="orb-prog" cx="50" cy="50" r="48"/>
        </svg>
        <div class="orb-inner"><img class="orb-roo" src="../assets/roo-wears/Kaftan.png" alt="Roo"></div>
      </div>

      <div class="splash-load">
        <span class="splash-txt">Preparing your experience...</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>

      <div class="kente">
        <div class="kb" style="background:#006B3F;opacity:.35"></div>
        <div class="kb" style="background:#FCD116;opacity:.5"></div>
        <div class="kb" style="background:#CE1126;opacity:.3"></div>
        <div class="kb" style="background:#00C1B2;opacity:.4"></div>
        <div class="kb" style="background:#004943;opacity:.3"></div>
        <div class="kb" style="background:#FF6B35;opacity:.3"></div>
        <div class="kb" style="background:#006B3F;opacity:.35"></div>
        <div class="kb" style="background:#FCD116;opacity:.5"></div>
        <div class="kb" style="background:#00C1B2;opacity:.4"></div>
        <div class="kb" style="background:#CE1126;opacity:.3"></div>
      </div>
    </div>
  </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navigate = (file) => {
            window.parent.postMessage({ type: 'navigate', file: file }, '*');
        };

        // Navigation Mappings
        const selectors = [
            { sel: '.auth-btn, .verify-btn, .otp-input', to: '03_home_feed.html' },
            { sel: '.rest-card, .trending-item', to: '05_restaurant_menu.html' },
            { sel: '.dish-card, .menu-item', to: '06_item_customization.html' },
            { sel: '.add-cart', to: '07_cart_checkout.html' },
            { sel: '.checkout-btn', to: '08_live_tracking.html' },
            { sel: '.roo-fab, .chat-btn', to: '10_roo_chat.html' },
            { sel: '.nav-item:nth-child(1)', to: '03_home_feed.html' },
            { sel: '.nav-item:nth-child(2)', to: '04_search_explore.html' },
            { sel: '.nav-item:nth-child(3)', to: '08_live_tracking.html' },
            { sel: '.nav-item:nth-child(4)', to: '12_profile_settings.html' },
            { sel: '.back-btn', to: '03_home_feed.html' }
        ];

        selectors.forEach(item => {
            document.querySelectorAll(item.sel).forEach(el => {
                el.style.cursor = 'pointer';
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigate(item.to);
                });
            });
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliveroo West Africa — Mobile Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #00C1B2;
            --ink: #1A1C1C;
            --orange: #FF6B35;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: row; /* Sidebar layout */
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 320px;
            background: #101414;
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            z-index: 100;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--teal);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            font-weight: 700;
        }

        .mode-switcher {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn:hover { background: rgba(255,255,255,0.08); }
        .btn.active {
            background: var(--teal);
            border-color: var(--teal);
            box-shadow: 0 10px 30px rgba(0, 193, 178, 0.3);
        }

        .btn span { font-size: 18px; }

        /* Main Stage */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #141a19 0%, #080a0a 100%);
            position: relative;
        }

        /* Phone Frame */
        .phone-frame {
            width: 416px; /* 390 + border */
            height: 870px; /* 844 + border */
            background: #000;
            border-radius: 60px;
            border: 13px solid #1a1c1c;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .phone-content {
            width: 390px;
            height: 844px;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #1a1c1c;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 100;
        }

        .screen-info {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">Deliveroo <br>West Africa</div>
        
        <div class="control-group">
            <div class="label">Experience Mode</div>
            <div class="mode-switcher">
                <button class="btn active" id="btnNG" onclick="setMode('nigeria')">
                    Nigeria — Dark Mode <span>🇳🇬</span>
                </button>
                <button class="btn" id="btnGH" onclick="setMode('ghana')">
                    Ghana — Light Mode <span>🇬🇭</span>
                </button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">App Info</div>
            <p style="font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.5);">
                Click through the app to test the flow. The "Nigeria" mode uses high-contrast dark patterns, while "Ghana" uses a clean light theme.
            </p>
        </div>

        <button class="btn" onclick="location.reload()" style="margin-top: auto;">
            Reset App <span>🔄</span>
        </button>
    </div>

    <div class="stage">
        <div class="phone-frame">
            <div class="notch"></div>
            <div class="phone-content">
                <iframe id="appFrame" src="01_splash_preloader.html"></iframe>
            </div>
        </div>
        <div class="screen-info" id="hud">01_splash_preloader.html</div>
    </div>

    <script>
        const frame = document.getElementById('appFrame');
        const hud = document.getElementById('hud');
        let currentMode = localStorage.getItem('deliveroo_country') || 'nigeria';

        function setMode(mode) {
            currentMode = mode;
            localStorage.setItem('deliveroo_country', mode);
            document.getElementById('btnNG').classList.toggle('active', mode === 'nigeria');
            document.getElementById('btnGH').classList.toggle('active', mode === 'ghana');
            
            // Send message to iframe
            if (frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'setMode', mode: mode }, '*');
            }
        }

        // Bridge for navigation
        window.addEventListener('message', (event) => {
            if (event.data.type === 'navigate') {
                frame.src = event.data.file;
                hud.innerText = event.data.file;
                
                // Re-apply mode after load
                frame.onload = () => {
                    setMode(currentMode);
                };
            }
        });

        // Initialize mode on first load
        frame.onload = () => {
            setMode(currentMode);
        };

        // Auto-advance Splash
        setTimeout(() => {
            if (frame.src.includes('01_splash')) {
                frame.src = '02_authentication.html';
            }
        }, 4500);
    </script>
</body>
</html>
